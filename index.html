<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noemi's Book Journal V7</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--p:#5b4b8a;--bg:#fbf8f2;--fg:#29243a;--card:#fff;--line:#ddd5e5;--muted:#756d80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui}body.dark{--bg:#17151d;--fg:#f5f1fb;--card:#25212c;--line:#4b4255;--muted:#bdb4c8}header,main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1,h2,h3{font-family:Georgia,serif}button{border:0;border-radius:10px;padding:10px 13px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.alt{background:#eee9f4;color:var(--p)}.danger{background:#f6dede;color:#922}.hero{padding:22px;border-radius:20px;background:linear-gradient(130deg,#3d315e,#745c99);color:#fff;display:flex;justify-content:space-between}.stats,.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{gap:20px}.stats b{display:block;font-size:1.5rem}.toolbar{margin:18px 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;grid-template-columns:90px 1fr;gap:12px}.card img,.cover{width:90px;height:135px;object-fit:cover;border-radius:8px;background:#eee9f4}.cover{display:grid;place-items:center;text-align:center;color:var(--p)}.muted{color:var(--muted);font-size:.85rem}.stars{color:#dda423}.badge{display:inline-block;background:#eee9f4;color:var(--p);border-radius:99px;padding:4px 7px;font-size:.7rem;font-weight:700}.hidden{display:none!important}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:inherit}.field{margin:11px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{width:min(760px,95vw);max-height:94vh;border:0;border-radius:18px;background:var(--card);color:var(--fg);padding:20px}dialog::backdrop{background:#211a30aa}dialog form{max-height:88vh;overflow:auto}.ratings{display:flex;gap:2px}.ratings button{background:none;border:0;color:#aaa;font-size:1.55rem;padding:4px;cursor:pointer;opacity:.23;filter:grayscale(.7);transition:.15s}.ratings button:hover{opacity:.7;transform:scale(1.08)}.ratings button.on{color:#dda423;opacity:1;filter:none}.ratings.sp button.on{opacity:1;filter:none}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;margin-top:8px}.result{display:flex;text-align:left;gap:6px;background:#eee9f4;color:#29243a}.result img{width:38px;height:55px;object-fit:cover}.result small{display:block}.empty{text-align:center;padding:45px}.shared{max-width:620px;margin:20px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.shared img{max-width:180px;border-radius:8px}@media(max-width:650px){.row{grid-template-columns:1fr}.hero{display:block}.stats{margin-top:16px}.card{grid-template-columns:80px 1fr}.card img,.cover{width:80px;height:120px}.toolbar{display:grid}}@media print{header,.toolbar,.actions{display:none!important}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>📚 Noemi's Book Journal 📚</h1><div class="actions"><button id="theme" class="alt">Dark mode</button><button id="pdf" class="alt">Export PDF</button></div></header><main><section id="shared" class="shared hidden"></section><section id="app"><div class="hero"><div><h2>Your reading life</h2><label>Reading goal <input id="goal" type="number" min="1" value="24" style="width:75px"></label><progress id="progress" value="0" max="24"></progress></div><div class="stats"><div><b id="count">0</b>Books</div><div><b id="avg">0.0</b>Avg</div><div><b id="done">0</b>Finished</div></div></div><div class="toolbar"><input id="filter" placeholder="Search title, author, notes, or tags"><select id="filterStatus"><option value="">All statuses</option><option>Want to Read</option><option>Currently Reading</option><option>Finished</option><option>DNF</option></select><button id="add">＋ Add book</button></div><div id="grid" class="grid"></div><div id="empty" class="empty"><h2>No books yet</h2></div></section></main>
<dialog id="dlg"><form id="form"><h2>Add or edit book</h2><input id="id" type="hidden"><div class="field"><label>Find book and cover</label><div class="actions"><input id="lookup" placeholder="Title, author, or ISBN"><button type="button" id="search">Search</button></div><div id="results" class="results"></div></div><div class="row"><label>Title<input id="title" required></label><label>Author<input id="author"></label></div><div class="field"><label>Cover URL<input id="coverUrl"></label><label>Or take/upload a photo<input id="coverFile" type="file" accept="image/*" capture="environment"></label></div><div class="row"><label>Status<select id="status"><option>Want to Read</option><option>Currently Reading</option><option>Finished</option><option>DNF</option></select></label><label>Favorite character<input id="character"></label></div><div class="row"><fieldset><legend>Rating</legend><div id="rating" class="ratings"></div></fieldset><fieldset><legend>🌶️ Spice Level</legend><div id="spice" class="ratings sp"></div></fieldset></div><div class="field"><label>Notes<textarea id="notes" rows="5"></textarea></label></div><div class="row"><label>Recommend<select id="recommend"><option>Yes</option><option>Maybe</option><option>No</option></select></label><label>Tags<input id="tags"></label></div><div class="field"><label><input id="public" type="checkbox" style="width:auto"> Public/shareable</label></div><div class="actions"><button type="button" id="cancel" class="alt">Cancel</button><button type="submit">Save</button></div></form></dialog>
<script>
const SUPABASE_URL='https://avvypwbowkslcrhdjcge.supabase.co';const SUPABASE_KEY='sb_publishable_KMnhbqqJ1EHl5TFsbvUM2A_s0TiZVkd';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=s=>document.querySelector(s);let books=[],rating=0,spice=0;const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stars=n=>`<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`,chiles=n=>'🌶️'.repeat(n);
function widget(sel,set,sym){for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent=sym;b.setAttribute('aria-label',`${i} of 5`);b.onclick=()=>{set(i);paint()};$(sel).appendChild(b)}}function paint(){[...$('#rating').children].forEach((b,i)=>b.classList.toggle('on',i<rating));[...$('#spice').children].forEach((b,i)=>b.classList.toggle('on',i<spice))}
async function load(){const {data,error}=await db.from('books').select('*').order('updated_at',{ascending:false});if(error)return alert(error.message);books=data||[];render()}
function render(){const q=$('#filter').value.toLowerCase(),fs=$('#filterStatus').value,list=books.filter(b=>(!fs||b.reading_status===fs)&&[b.title,b.author,b.notes,b.tags].join(' ').toLowerCase().includes(q));$('#grid').innerHTML=list.map(b=>`<article class="card">${b.cover_url?`<img src="${esc(b.cover_url)}">`:`<div class="cover">${esc(b.title)}</div>`}<div><span class="badge">${esc(b.reading_status)}</span><h3>${esc(b.title)}</h3><div class="muted">${esc(b.author)}</div><div>${stars(b.rating)} ${chiles(b.spice)}</div><div class="actions"><button class="alt" onclick="viewBook('${b.id}')">View</button><button onclick="editBook('${b.id}')">Edit</button><button onclick="shareBook('${b.id}')">Share</button><button class="danger" onclick="deleteBook('${b.id}')">Delete</button></div></div></article>`).join('');const done=books.filter(b=>b.reading_status==='Finished').length,goal=+(localStorage.goal||24);$('#empty').classList.toggle('hidden',books.length>0);$('#count').textContent=books.length;$('#avg').textContent=books.length?(books.reduce((a,b)=>a+b.rating,0)/books.length).toFixed(1):'0.0';$('#done').textContent=done;$('#goal').value=goal;$('#progress').max=goal;$('#progress').value=done}
function openForm(b={}){$('#form').reset();$('#results').innerHTML='';for(const k of ['id','title','author','notes','tags'])$('#'+k).value=b[k]||'';$('#coverUrl').value=b.cover_url||'';$('#status').value=b.reading_status||'Want to Read';$('#character').value=b.favorite_character||'';$('#recommend').value=b.recommendation||'Maybe';$('#public').checked=!!b.is_public;rating=b.rating||0;spice=b.spice||0;paint();$('#dlg').showModal()}
window.editBook=id=>openForm(books.find(b=>b.id===id));window.viewBook=id=>{const b=books.find(x=>x.id===id);alert(`${b.title}\n${b.author||''}\nRating ${b.rating}/5 | Spice ${b.spice}/5\nFavorite: ${b.favorite_character||''}\nRecommend: ${b.recommendation}\n\n${b.notes||''}`)};window.deleteBook=async id=>{if(confirm('Delete this book?')){const {error}=await db.from('books').delete().eq('id',id);error?alert(error.message):load()}};window.shareBook=async id=>{const b=books.find(x=>x.id===id);if(!b.is_public){if(!confirm('Make this book public?'))return;const {error}=await db.from('books').update({is_public:true}).eq('id',id);if(error)return alert(error.message)}const url=`${location.origin}${location.pathname}?share=${b.share_token}`;navigator.share?await navigator.share({title:b.title,url}):(await navigator.clipboard.writeText(url),alert('Share link copied'))};
$('#form').onsubmit=async e=>{e.preventDefault();const id=$('#id').value,row={title:$('#title').value.trim(),author:$('#author').value.trim(),cover_url:$('#coverUrl').value.trim(),rating,spice,reading_status:$('#status').value,favorite_character:$('#character').value.trim(),notes:$('#notes').value.trim(),recommendation:$('#recommend').value,tags:$('#tags').value.trim(),is_public:$('#public').checked,updated_at:new Date().toISOString()},r=id?await db.from('books').update(row).eq('id',id):await db.from('books').insert(row);if(r.error)return alert(r.error.message);$('#dlg').close();load()};
$('#search').onclick=async()=>{const q=$('#lookup').value.trim();if(!q)return;$('#results').textContent='Searching...';try{const d=await(await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=6&fields=title,author_name,cover_i`)).json();$('#results').innerHTML=d.docs.map((b,i)=>`<button type="button" class="result" data-i="${i}">${b.cover_i?`<img src="https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg">`:''}<span><b>${esc(b.title)}</b><small>${esc((b.author_name||[]).join(', '))}</small></span></button>`).join('');document.querySelectorAll('.result').forEach(x=>x.onclick=()=>{const b=d.docs[+x.dataset.i];$('#title').value=b.title||'';$('#author').value=(b.author_name||[]).join(', ');$('#coverUrl').value=b.cover_i?`https://covers.openlibrary.org/b/id/${b.cover_i}-L.jpg`:''})}catch{$('#results').textContent='Search unavailable.'}};
$('#coverFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>4e6)return alert('Image must be smaller than 4 MB');const r=new FileReader;r.onload=()=>$('#coverUrl').value=r.result;r.readAsDataURL(f)};async function shared(){const t=new URLSearchParams(location.search).get('share');if(!t)return false;const {data}=await db.from('books').select('*').eq('share_token',t).eq('is_public',true).maybeSingle();$('#app').classList.add('hidden');$('#shared').classList.remove('hidden');$('#shared').innerHTML=data?`${data.cover_url?`<img src="${esc(data.cover_url)}">`:''}<h1>${esc(data.title)}</h1><p>${esc(data.author)}</p><p>${stars(data.rating)} ${chiles(data.spice)}</p><p>${esc(data.notes)}</p>`:'<h2>Shared book not found</h2>';return true}
$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dlg').close();$('#filter').oninput=render;$('#filterStatus').onchange=render;$('#goal').onchange=()=>{localStorage.goal=$('#goal').value;render()};$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.theme=document.body.classList.contains('dark')?'dark':'light'};if(localStorage.theme==='dark')document.body.classList.add('dark');$('#pdf').onclick=()=>print();widget('#rating',v=>rating=rating===v?0:v,'★');widget('#spice',v=>spice=spice===v?0:v,'🌶️');(async()=>{if(!await shared())load()})();
</script></body></html>
