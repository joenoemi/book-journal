<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noemi's Book Journal V8</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--p:#5b4b8a;--bg:#fbf8f2;--fg:#29243a;--card:#fff;--line:#ddd5e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui}body.dark{--bg:#17151d;--fg:#f5f1fb;--card:#25212c;--line:#4b4255}header,main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1,h2,h3{font-family:Georgia,serif}button{border:0;border-radius:10px;padding:10px 13px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.alt{background:#eee9f4;color:var(--p)}.danger{background:#f6dede;color:#922}.hero{padding:22px;border-radius:20px;background:linear-gradient(130deg,#3d315e,#745c99);color:#fff;display:flex;justify-content:space-between}.stats,.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{gap:20px}.stats b{display:block;font-size:1.5rem}.toolbar{margin:18px 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;grid-template-columns:90px 1fr;gap:12px}.card img,.cover{width:90px;height:135px;object-fit:cover;border-radius:8px;background:#eee9f4}.cover{display:grid;place-items:center;text-align:center;color:var(--p)}.stars{color:#dda423}.hidden{display:none!important}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:inherit}.field{margin:11px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{width:min(760px,95vw);max-height:94vh;border:0;border-radius:18px;background:var(--card);color:var(--fg);padding:20px}dialog::backdrop{background:#211a30aa}dialog form{max-height:88vh;overflow:auto}.ratings{display:flex}.ratings button{background:none;border:0;font-size:1.6rem;padding:4px;opacity:.22;filter:grayscale(.7)}.ratings button.on{opacity:1;filter:none}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}.result{display:flex;text-align:left;gap:6px;background:#eee9f4;color:#29243a}.result img{width:38px;height:55px;object-fit:cover}.lock{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#2f254b,#745c99)}.lock-card{width:min(430px,100%);padding:28px;border-radius:22px;background:#fff;color:#29243a;text-align:center}.lock-card input{background:#fff;color:#29243a;margin:10px 0}.error{color:#922;min-height:1.2em}.shared{max-width:620px;margin:20px auto;text-align:center}.shared img{max-width:180px}@media(max-width:650px){.row{grid-template-columns:1fr}.hero{display:block}.toolbar{display:grid}.card{grid-template-columns:80px 1fr}.card img,.cover{width:80px;height:120px}}@media print{header,.toolbar,.actions{display:none!important}}
</style></head><body><section id="lockScreen" class="lock"><div class="lock-card"><div style="font-size:3rem">📚</div><h1>Noemi's Book Journal</h1><p>Enter the passphrase to continue.</p><form id="lockForm"><input id="passphrase" type="password" placeholder="Passphrase" required><button style="width:100%">Open Journal</button></form><p id="lockError" class="error"></p></div></section><header id="header" class="hidden"><h1>📚 Noemi's Book Journal 📚</h1><div class="actions"><button id="theme" class="alt">Dark mode</button><button id="pdf" class="alt">Export PDF</button><button id="lockBtn" class="alt">Lock</button></div></header><main id="main" class="hidden"><section id="shared" class="shared hidden"></section><section id="app"><div class="hero"><div><h2>Your reading life</h2><label>Goal <input id="goal" type="number" min="1" value="24" style="width:75px"></label><progress id="progress" value="0" max="24"></progress></div><div class="stats"><div><b id="count">0</b>Books</div><div><b id="avg">0.0</b>Avg</div><div><b id="done">0</b>Finished</div></div></div><div class="toolbar"><input id="filter" placeholder="Search journal"><select id="filterStatus"><option value="">All statuses</option><option>Want to Read</option><option>Currently Reading</option><option>Finished</option><option>DNF</option></select><button id="add">＋ Add book</button></div><div id="grid" class="grid"></div><div id="empty"><h2>No books yet</h2></div></section></main>
<dialog id="dlg"><form id="form"><h2>Add or edit book</h2><input id="id" type="hidden"><div class="field"><div class="actions"><input id="lookup" placeholder="Title, author, or ISBN"><button type="button" id="search">Search</button></div><div id="results" class="results"></div></div><div class="row"><label>Title<input id="title" required></label><label>Author<input id="author"></label></div><div class="field"><label>Cover URL<input id="coverUrl"></label><label>Or photo<input id="coverFile" type="file" accept="image/*" capture="environment"></label></div><div class="row"><label>Status<select id="status"><option>Want to Read</option><option>Currently Reading</option><option>Finished</option><option>DNF</option></select></label><label>Favorite character<input id="character"></label></div><div class="row"><fieldset><legend>Rating</legend><div id="rating" class="ratings"></div></fieldset><fieldset><legend>🌶️ Spice Level</legend><div id="spice" class="ratings"></div></fieldset></div><label>Notes<textarea id="notes" rows="5"></textarea></label><div class="row"><label>Recommend<select id="recommend"><option>Yes</option><option>Maybe</option><option>No</option></select></label><label>Tags<input id="tags"></label></div><label><input id="public" type="checkbox" style="width:auto"> Public/shareable</label><div class="actions"><button type="button" id="cancel" class="alt">Cancel</button><button>Save</button></div></form></dialog>
<script>
const JOURNAL_PASSPHRASE='CHANGE_THIS_PASSPHRASE';const URL='https://avvypwbowkslcrhdjcge.supabase.co',KEY='sb_publishable_KMnhbqqJ1EHl5TFsbvUM2A_s0TiZVkd',db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s);let books=[],rating=0,spice=0;const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stars=n=>`<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`,chiles=n=>'🌶️'.repeat(n);
function unlock(){sessionStorage.unlocked='yes';$('#lockScreen').classList.add('hidden');$('#header').classList.remove('hidden');$('#main').classList.remove('hidden')}$('#lockForm').onsubmit=e=>{e.preventDefault();if($('#passphrase').value===JOURNAL_PASSPHRASE)unlock();else{$('#lockError').textContent='Incorrect passphrase.';$('#passphrase').select()}};if(sessionStorage.unlocked==='yes')unlock();$('#lockBtn').onclick=()=>{sessionStorage.removeItem('unlocked');location.reload()};
function widget(sel,set,sym){for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent=sym;b.onclick=()=>{set(i);paint()};$(sel).appendChild(b)}}function paint(){[...$('#rating').children].forEach((b,i)=>b.classList.toggle('on',i<rating));[...$('#spice').children].forEach((b,i)=>b.classList.toggle('on',i<spice))}async function load(){const {data,error}=await db.from('books').select('*').order('updated_at',{ascending:false});if(error)return alert(error.message);books=data||[];render()}
function render(){const q=$('#filter').value.toLowerCase(),fs=$('#filterStatus').value,list=books.filter(b=>(!fs||b.reading_status===fs)&&[b.title,b.author,b.notes,b.tags].join(' ').toLowerCase().includes(q));$('#grid').innerHTML=list.map(b=>`<article class="card">${b.cover_url?`<img src="${esc(b.cover_url)}">`:`<div class="cover">${esc(b.title)}</div>`}<div><h3>${esc(b.title)}</h3><div>${esc(b.author||'')}</div><div>${stars(b.rating)} ${chiles(b.spice)}</div><div class="actions"><button class="alt" onclick="viewBook('${b.id}')">View</button><button onclick="editBook('${b.id}')">Edit</button><button onclick="shareBook('${b.id}')">Share</button><button class="danger" onclick="deleteBook('${b.id}')">Delete</button></div></div></article>`).join('');const d=books.filter(b=>b.reading_status==='Finished').length,g=+(localStorage.goal||24);$('#empty').classList.toggle('hidden',books.length>0);$('#count').textContent=books.length;$('#avg').textContent=books.length?(books.reduce((a,b)=>a+b.rating,0)/books.length).toFixed(1):'0.0';$('#done').textContent=d;$('#goal').value=g;$('#progress').max=g;$('#progress').value=d}
function openForm(b={}){$('#form').reset();$('#results').innerHTML='';for(const k of ['id','title','author','notes','tags'])$('#'+k).value=b[k]||'';$('#coverUrl').value=b.cover_url||'';$('#status').value=b.reading_status||'Want to Read';$('#character').value=b.favorite_character||'';$('#recommend').value=b.recommendation||'Maybe';$('#public').checked=!!b.is_public;rating=b.rating||0;spice=b.spice||0;paint();$('#dlg').showModal()}window.editBook=id=>openForm(books.find(b=>b.id===id));window.viewBook=id=>{const b=books.find(x=>x.id===id);alert(`${b.title}\n${b.author||''}\nRating ${b.rating}/5 | Spice ${b.spice}/5\nFavorite: ${b.favorite_character||''}\nRecommend: ${b.recommendation}\n\n${b.notes||''}`)};window.deleteBook=async id=>{if(confirm('Delete this book?')){const {error}=await db.from('books').delete().eq('id',id);error?alert(error.message):load()}};window.shareBook=async id=>{const b=books.find(x=>x.id===id);if(!b.is_public){if(!confirm('Make this book public?'))return;const {error}=await db.from('books').update({is_public:true}).eq('id',id);if(error)return alert(error.message)}const u=`${location.origin}${location.pathname}?share=${b.share_token}`;navigator.share?await navigator.share({title:b.title,url:u}):(await navigator.clipboard.writeText(u),alert('Link copied'))};
$('#form').onsubmit=async e=>{e.preventDefault();const id=$('#id').value,row={title:$('#title').value,author:$('#author').value,cover_url:$('#coverUrl').value,rating,spice,reading_status:$('#status').value,favorite_character:$('#character').value,notes:$('#notes').value,recommendation:$('#recommend').value,tags:$('#tags').value,is_public:$('#public').checked,updated_at:new Date().toISOString()},r=id?await db.from('books').update(row).eq('id',id):await db.from('books').insert(row);if(r.error)return alert(r.error.message);$('#dlg').close();load()};$('#search').onclick=async()=>{const q=$('#lookup').value;if(!q)return;const d=await(await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=6&fields=title,author_name,cover_i`)).json();$('#results').innerHTML=d.docs.map((b,i)=>`<button type="button" class="result" data-i="${i}">${b.cover_i?`<img src="https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg">`:''}<span>${esc(b.title)}<small>${esc((b.author_name||[]).join(', '))}</small></span></button>`).join('');document.querySelectorAll('.result').forEach(x=>x.onclick=()=>{const b=d.docs[+x.dataset.i];$('#title').value=b.title;$('#author').value=(b.author_name||[]).join(', ');$('#coverUrl').value=b.cover_i?`https://covers.openlibrary.org/b/id/${b.cover_i}-L.jpg`:''})};$('#coverFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>$('#coverUrl').value=r.result;r.readAsDataURL(f)};
async function shared(){const t=new URLSearchParams(location.search).get('share');if(!t)return false;unlock();const {data}=await db.from('books').select('*').eq('share_token',t).eq('is_public',true).maybeSingle();$('#app').classList.add('hidden');$('#shared').classList.remove('hidden');$('#shared').innerHTML=data?`${data.cover_url?`<img src="${esc(data.cover_url)}">`:''}<h1>${esc(data.title)}</h1><p>${esc(data.author)}</p><p>${stars(data.rating)} ${chiles(data.spice)}</p><p>${esc(data.notes)}</p>`:'<h2>Shared book not found</h2>';return true}$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dlg').close();$('#filter').oninput=render;$('#filterStatus').onchange=render;$('#goal').onchange=()=>{localStorage.goal=$('#goal').value;render()};$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#pdf').onclick=()=>print();widget('#rating',v=>rating=rating===v?0:v,'★');widget('#spice',v=>spice=spice===v?0:v,'🌶️');(async()=>{if(!await shared())load()})();
</script></body></html>
