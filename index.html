<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Book Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#5b4b8a;--bg:#fbf8f2;--ink:#29243a;--line:#ded7e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header,main{max-width:950px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1,h2{font-family:Georgia,serif}button{border:0;border-radius:10px;padding:11px 15px;background:var(--p);color:white;font-weight:700;cursor:pointer}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:14px}.card img,.cover{width:90px;height:130px;object-fit:cover;border-radius:8px;background:#eee9f4}.cover{display:grid;place-items:center;text-align:center;color:var(--p)}.actions{display:flex;gap:7px;margin-top:10px}.actions button{padding:8px 10px}.stars{color:#d99c22}.spice{color:#c94f3d}.muted{color:#716a7b;font-size:.86rem}.empty{text-align:center;padding:70px 15px}dialog{width:min(700px,95vw);border:0;border-radius:18px;padding:0}dialog::backdrop{background:#211a30aa}form{padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.ratings{display:flex;gap:6px}.ratings button{background:transparent;color:#bbb;font-size:1.5rem;padding:2px}.ratings button.on{color:#d99c22}.ratings.sp button.on{color:#c94f3d}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.secondary{background:#eee9f4;color:var(--p)}#sharedView{max-width:600px;margin:30px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:25px;text-align:center}#sharedView img{max-width:180px;border-radius:10px}@media(max-width:600px){.row{grid-template-columns:1fr}.card{grid-template-columns:80px 1fr}.card img,.cover{width:80px;height:118px}}
</style></head><body>
<header><h1>📚 My Book Journal</h1><button id="add">＋ Add book</button></header>
<main><section id="sharedView" hidden></section><section id="journal"><div id="books" class="grid"></div><div id="empty" class="empty"><h2>Start your journal</h2><p>Add a book, notes, ratings, and a cover.</p></div></section></main>
<dialog id="dlg"><form id="form"><h2 id="formTitle">Add a book</h2><input id="id" type="hidden"><div class="row"><label>Title<input id="title" required></label><label>Author<input id="author"></label></div><div class="field"><label>Cover image URL<input id="cover" placeholder="https://..."></label></div><div class="row"><fieldset><legend>Rating</legend><div id="rating" class="ratings"></div></fieldset><fieldset><legend>Spice</legend><div id="spice" class="ratings sp"></div></fieldset></div><div class="field"><label>Favorite character<input id="character"></label></div><div class="field"><label>Recommendation<select id="recommend"><option>Yes</option><option>Maybe</option><option>No</option></select></label></div><div class="field"><label>Notes<textarea id="notes" rows="6"></textarea></label></div><div class="footer"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save</button></div></form></dialog>
<script>
const SUPABASE_URL='PASTE_YOUR_SUPABASE_PROJECT_URL_HERE';
const SUPABASE_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='book-journal-v3';let books=JSON.parse(localStorage.getItem(KEY)||'[]'),rating=0,spice=0;const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function marks(n,c){return `<span class="${c}">${'●'.repeat(n)}</span>`} function stars(n){return `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(books));render()}
function render(){const box=$('#books');box.innerHTML=books.map(b=>`<article class="card">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="Cover">`:`<div class="cover">${esc(b.title)}</div>`}<div><h3>${esc(b.title)}</h3><div class="muted">${esc(b.author)}</div><div>${stars(b.rating)} ${marks(b.spice,'spice')}</div><div class="muted">Recommend: ${esc(b.recommendation)}</div><div class="actions"><button onclick="editBook('${b.id}')">Edit</button><button onclick="shareBook('${b.id}')">Share</button></div></div></article>`).join('');$('#empty').hidden=books.length>0}
function ratingWidget(id,set){for(let i=1;i<=5;i++){let b=document.createElement('button');b.type='button';b.textContent=id==='#rating'?'★':'●';b.onclick=()=>{set(i);paint()};$(id).appendChild(b)}}
function paint(){[...$('#rating').children].forEach((b,i)=>b.classList.toggle('on',i<rating));[...$('#spice').children].forEach((b,i)=>b.classList.toggle('on',i<spice))}
function openForm(b={}){$('#form').reset();$('#id').value=b.id||'';$('#title').value=b.title||'';$('#author').value=b.author||'';$('#cover').value=b.cover_url||'';$('#character').value=b.favorite_character||'';$('#recommend').value=b.recommendation||'Yes';$('#notes').value=b.notes||'';rating=b.rating||0;spice=b.spice||0;paint();$('#dlg').showModal()}
window.editBook=id=>openForm(books.find(b=>b.id===id));
window.shareBook=async id=>{const b=books.find(x=>x.id===id);if(!b)return;const share_token=crypto.randomUUID();const row={share_token,title:b.title,author:b.author,cover_url:b.cover_url,rating:b.rating,spice:b.spice,favorite_character:b.favorite_character,recommendation:b.recommendation,notes:b.notes};const {error}=await db.from('shared_books').insert(row);if(error){alert('Could not create share link: '+error.message);return}const url=`${location.origin}${location.pathname}?share=${share_token}`;if(navigator.share){await navigator.share({title:b.title,text:`My book journal entry for ${b.title}`,url})}else{await navigator.clipboard.writeText(url);alert('Share link copied to clipboard.') }};
async function loadShared(){const token=new URLSearchParams(location.search).get('share');if(!token)return;$('#journal').hidden=true;$('header button').hidden=true;const {data,error}=await db.from('shared_books').select('*').eq('share_token',token).maybeSingle();const v=$('#sharedView');v.hidden=false;if(error||!data){v.innerHTML='<h2>Shared book not found</h2>';return}v.innerHTML=`${data.cover_url?`<img src="${esc(data.cover_url)}" alt="Book cover">`:''}<h1>${esc(data.title)}</h1><p class="muted">${esc(data.author)}</p><p>${stars(data.rating)} ${marks(data.spice,'spice')}</p><p><b>Favorite character:</b> ${esc(data.favorite_character)}</p><p><b>Recommend:</b> ${esc(data.recommendation)}</p><p>${esc(data.notes)}</p>`}
ratingWidget('#rating',v=>rating=v);ratingWidget('#spice',v=>spice=v);$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dlg').close();$('#form').onsubmit=e=>{e.preventDefault();const id=$('#id').value||crypto.randomUUID();const b={id,title:$('#title').value.trim(),author:$('#author').value.trim(),cover_url:$('#cover').value.trim(),rating,spice,favorite_character:$('#character').value.trim(),recommendation:$('#recommend').value,notes:$('#notes').value.trim()};const i=books.findIndex(x=>x.id===id);if(i<0)books.unshift(b);else books[i]=b;saveLocal();$('#dlg').close()};render();loadShared();
</script></body></html>
