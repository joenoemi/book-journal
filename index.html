<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4b8a">
<title>Noemi's Book Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#5b4b8a;--bg:#fbf8f2;--fg:#29243a;--card:#fff;--line:#ddd5e5;--muted:#756d80;--gold:#dda423;--red:#d45645}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body.dark{--bg:#17151d;--fg:#f5f1fb;--card:#25212c;--line:#4b4255;--muted:#bdb4c8}header,main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1,h2,h3{font-family:Georgia,serif;margin:.35em 0}button{border:0;border-radius:10px;padding:10px 13px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.alt{background:#eee9f4;color:var(--p)}.danger{background:#f6dede;color:#922}.hero{padding:22px;border-radius:20px;background:linear-gradient(130deg,#3d315e,#745c99);color:#fff;display:flex;justify-content:space-between;gap:20px}.stats{display:flex;gap:20px}.stats b{display:block;font-size:1.5rem}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:18px 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;grid-template-columns:90px 1fr;gap:12px}.card img,.cover{width:90px;height:135px;object-fit:cover;border-radius:8px;background:#eee9f4}.cover{display:grid;place-items:center;color:var(--p);text-align:center;padding:6px}.muted{color:var(--muted);font-size:.85rem}.stars{color:var(--gold)}.spice{color:var(--red)}.badge{display:inline-block;background:#eee9f4;color:var(--p);border-radius:99px;padding:4px 7px;font-size:.7rem;font-weight:700}.hidden{display:none!important}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:inherit}.field{margin:11px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{width:min(760px,95vw);max-height:94vh;border:0;border-radius:18px;background:var(--card);color:var(--fg);padding:20px}dialog::backdrop{background:#211a30aa}dialog form{max-height:88vh;overflow:auto}.ratings button{background:none;color:#aaa;font-size:1.5rem;padding:3px}.ratings button.on{color:var(--gold)}.ratings.sp button.on{color:var(--red)}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;margin-top:8px}.result{display:flex;text-align:left;gap:6px;background:#eee9f4;color:#29243a}.result img{width:38px;height:55px;object-fit:cover}.result small{display:block}.empty{text-align:center;padding:45px}.shared{max-width:620px;margin:20px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.shared img{max-width:180px;border-radius:8px}.notice{background:#fff4d6;border:1px solid #eed18a;padding:10px;border-radius:10px;margin:12px 0;color:#5e4a15}@media(max-width:650px){.row{grid-template-columns:1fr}.hero{display:block}.stats{margin-top:16px;justify-content:space-around}.card{grid-template-columns:80px 1fr}.card img,.cover{width:80px;height:120px}.toolbar{display:grid}}@media print{header,.toolbar,.actions,.notice{display:none!important}.grid{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid}}
</style>
</head>
<body>
<header><h1>📚 Noemi's Book Journal 📚</h1><div class="actions"><button id="theme" class="alt">Dark mode</button><button id="pdf" class="alt">Export PDF</button></div></header>
<main>
<section id="shared" class="shared hidden"></section>
<section id="app">
<div class="hero"><div><h2>Your reading life</h2><label>Reading goal <input id="goal" type="number" min="1" value="24" style="width:75px"></label><progress id="progress" value="0" max="24"></progress></div><div class="stats"><div><b id="count">0</b>Books</div><div><b id="avg">0.0</b>Avg</div><div><b id="done">0</b>Finished</div></div></div>
<div id="notice" class="notice hidden"></div>
<div class="toolbar"><input id="filter" placeholder="Search title, author, notes, or tags"><select id="filterStatus"><option value="">All statuses</option><option>Want to Read</option><option>Currently Reading</option><option>Finished</option><option>DNF</option></select><button id="add">＋ Add book</button></div>
<div id="grid" class="grid"></div><div id="empty" class="empty"><h2>No books yet</h2><p>Add the first book to the journal.</p></div>
</section>
</main>
<dialog id="dlg"><form id="form"><h2>Add or edit book</h2><input id="id" type="hidden">
<div class="field"><label>Find book and cover</label><div class="actions"><input id="lookup" placeholder="Title, author, or ISBN"><button type="button" id="search">Search</button></div><div id="results" class="results"></div></div>
<div class="row"><label>Title<input id="title" required></label><label>Author<input id="author"></label></div>
<div class="field"><label>Cover URL<input id="coverUrl"></label><label>Or take/upload a photo<input id="coverFile" type="file" accept="image/*" capture="environment"></label></div>
<div class="row"><label>Status<select id="status"><option>Want to Read</option><option>Currently Reading</option><option>Finished</option><option>DNF</option></select></label><label>Favorite character<input id="character"></label></div>
<div class="row"><fieldset><legend>Rating</legend><div id="rating" class="ratings"></div></fieldset><fieldset><legend>Spice</legend><div id="spice" class="ratings sp"></div></fieldset></div>
<div class="field"><label>Notes<textarea id="notes" rows="5"></textarea></label></div>
<div class="row"><label>Recommend<select id="recommend"><option>Yes</option><option>Maybe</option><option>No</option></select></label><label>Tags<input id="tags" placeholder="Fantasy, book club"></label></div>
<div class="field"><label><input id="public" type="checkbox" style="width:auto"> Public/shareable</label></div>
<div class="actions"><button type="button" id="cancel" class="alt">Cancel</button><button type="submit">Save</button></div></form></dialog>
<script>
const SUPABASE_URL='https://avvypwbowkslcrhdjcge.supabase.co';
const SUPABASE_KEY='sb_publishable_KMnhbqqJ1EHl5TFsbvUM2A_s0TiZVkd';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=selector=>document.querySelector(selector);
let books=[],rating=0,spice=0;
const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const stars=n=>`<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
function showNotice(message){$('#notice').textContent=message;$('#notice').classList.remove('hidden')}
function widget(selector,setter,symbol){for(let i=1;i<=5;i++){const button=document.createElement('button');button.type='button';button.textContent=symbol;button.onclick=()=>{setter(i);paintRatings()};$(selector).appendChild(button)}}
function paintRatings(){[...$('#rating').children].forEach((button,index)=>button.classList.toggle('on',index<rating));[...$('#spice').children].forEach((button,index)=>button.classList.toggle('on',index<spice))}
async function load(){const {data,error}=await db.from('books').select('*').order('updated_at',{ascending:false});if(error){showNotice(`Database error: ${error.message}`);return}books=data||[];render()}
function render(){const query=$('#filter').value.toLowerCase(),status=$('#filterStatus').value;const visible=books.filter(book=>(!status||book.reading_status===status)&&[book.title,book.author,book.notes,book.tags].join(' ').toLowerCase().includes(query));$('#grid').innerHTML=visible.map(book=>`<article class="card">${book.cover_url?`<img src="${esc(book.cover_url)}" alt="Book cover">`:`<div class="cover">${esc(book.title)}</div>`}<div><span class="badge">${esc(book.reading_status)}</span><h3>${esc(book.title)}</h3><div class="muted">${esc(book.author)}</div><div>${stars(book.rating)} <span class="spice">${'●'.repeat(book.spice)}</span></div><div class="actions"><button onclick="viewBook('${book.id}')" class="alt">View</button><button onclick="editBook('${book.id}')">Edit</button><button onclick="shareBook('${book.id}')">Share</button><button onclick="deleteBook('${book.id}')" class="danger">Delete</button></div></div></article>`).join('');const finished=books.filter(book=>book.reading_status==='Finished').length,goal=Number(localStorage.getItem('readingGoal')||24);$('#empty').classList.toggle('hidden',books.length>0);$('#count').textContent=books.length;$('#avg').textContent=books.length?(books.reduce((sum,book)=>sum+book.rating,0)/books.length).toFixed(1):'0.0';$('#done').textContent=finished;$('#goal').value=goal;$('#progress').max=goal;$('#progress').value=finished}
function openForm(book={}){$('#form').reset();$('#results').innerHTML='';$('#id').value=book.id||'';$('#title').value=book.title||'';$('#author').value=book.author||'';$('#coverUrl').value=book.cover_url||'';$('#status').value=book.reading_status||'Want to Read';$('#character').value=book.favorite_character||'';$('#notes').value=book.notes||'';$('#recommend').value=book.recommendation||'Maybe';$('#tags').value=book.tags||'';$('#public').checked=Boolean(book.is_public);rating=book.rating||0;spice=book.spice||0;paintRatings();$('#dlg').showModal()}
window.editBook=id=>openForm(books.find(book=>book.id===id));
window.viewBook=id=>{const book=books.find(item=>item.id===id);alert(`${book.title}\n${book.author||''}\nRating ${book.rating}/5 | Spice ${book.spice}/5\nFavorite: ${book.favorite_character||''}\nRecommend: ${book.recommendation}\n\n${book.notes||''}`)};
window.deleteBook=async id=>{if(!confirm('Delete this book?'))return;const {error}=await db.from('books').delete().eq('id',id);error?alert(error.message):load()};
window.shareBook=async id=>{const book=books.find(item=>item.id===id);if(!book.is_public){if(!confirm('Make this book public and create a share link?'))return;const {error}=await db.from('books').update({is_public:true,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);book.is_public=true}const url=`${location.origin}${location.pathname}?share=${book.share_token}`;if(navigator.share){await navigator.share({title:book.title,text:`Book journal entry for ${book.title}`,url})}else{await navigator.clipboard.writeText(url);alert('Share link copied')}};
$('#form').onsubmit=async event=>{event.preventDefault();const id=$('#id').value;const row={title:$('#title').value.trim(),author:$('#author').value.trim(),cover_url:$('#coverUrl').value.trim(),rating,spice,reading_status:$('#status').value,favorite_character:$('#character').value.trim(),notes:$('#notes').value.trim(),recommendation:$('#recommend').value,tags:$('#tags').value.trim(),is_public:$('#public').checked,updated_at:new Date().toISOString()};const result=id?await db.from('books').update(row).eq('id',id):await db.from('books').insert(row);if(result.error)return alert(result.error.message);$('#dlg').close();load()};
$('#search').onclick=async()=>{const query=$('#lookup').value.trim();if(!query)return;$('#results').textContent='Searching...';try{const response=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=6&fields=title,author_name,cover_i`);const data=await response.json();$('#results').innerHTML=data.docs.map((book,index)=>`<button type="button" class="result" data-index="${index}">${book.cover_i?`<img src="https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg" alt="">`:''}<span><b>${esc(book.title)}</b><small>${esc((book.author_name||[]).join(', '))}</small></span></button>`).join('');document.querySelectorAll('.result').forEach(button=>button.onclick=()=>{const book=data.docs[Number(button.dataset.index)];$('#title').value=book.title||'';$('#author').value=(book.author_name||[]).join(', ');$('#coverUrl').value=book.cover_i?`https://covers.openlibrary.org/b/id/${book.cover_i}-L.jpg`:''})}catch(error){$('#results').textContent='Book search is unavailable.'}};
$('#coverFile').onchange=event=>{const file=event.target.files[0];if(!file)return;if(file.size>4000000)return alert('Please choose an image smaller than 4 MB.');const reader=new FileReader();reader.onload=()=>$('#coverUrl').value=reader.result;reader.readAsDataURL(file)};
async function openShared(){const token=new URLSearchParams(location.search).get('share');if(!token)return false;const {data,error}=await db.from('books').select('*').eq('share_token',token).eq('is_public',true).maybeSingle();$('#app').classList.add('hidden');$('#shared').classList.remove('hidden');$('#shared').innerHTML=!error&&data?`${data.cover_url?`<img src="${esc(data.cover_url)}" alt="Book cover">`:''}<h1>${esc(data.title)}</h1><p>${esc(data.author)}</p><p>${stars(data.rating)} <span class="spice">${'●'.repeat(data.spice)}</span></p><p><b>Favorite character:</b> ${esc(data.favorite_character)}</p><p><b>Recommend:</b> ${esc(data.recommendation)}</p><p>${esc(data.notes)}</p>`:'<h2>Shared book not found</h2>';return true}
$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dlg').close();$('#filter').oninput=render;$('#filterStatus').onchange=render;$('#goal').onchange=()=>{localStorage.setItem('readingGoal',$('#goal').value||24);render()};$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');$('#pdf').onclick=()=>window.print();widget('#rating',value=>rating=rating===value?0:value,'★');widget('#spice',value=>spice=spice===value?0:value,'●');(async()=>{if(!await openShared())load()})();
</script>
</body>
</html>
